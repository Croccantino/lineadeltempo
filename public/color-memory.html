<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Colori - Simon</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --ink: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--ink);
    }
    .card {
      width: min(92vw, 460px);
      background: var(--card);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .subtitle { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
    .stats {
      display: flex;
      justify-content: space-between;
      margin: 8px 0 16px;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin: 0 auto 16px;
      max-width: 320px;
    }
    .pad {
      border: 0;
      border-radius: 16px;
      height: 110px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,0.35);
      transition: transform 0.08s, filter 0.12s, box-shadow 0.12s;
      opacity: 0.85;
    }
    .pad.lit {
      filter: brightness(1.6) saturate(1.4);
      transform: scale(1.06);
      box-shadow: 0 0 30px currentColor;
      opacity: 1;
    }
    .pad:active { transform: scale(0.96); }
    .message { min-height: 26px; font-weight: 600; margin-top: 8px; }
    .message.ok { color: #4ade80; }
    .message.ko { color: #f87171; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
    .btn {
      border: 0; border-radius: 10px; padding: 10px 16px;
      background: #334155; color: #fff; font-weight: 600; cursor: pointer;
    }
    .btn.primary { background: #2563eb; }
    .speed { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🧠 Memory Colori</h1>
    <p class="subtitle">Memorizza la sequenza dei colori e ripetila.</p>

    <div class="stats">
      <span>Livello: <strong id="level">0</strong></span>
      <span>Punteggio: <strong id="score">0</strong></span>
      <span>Record: <strong id="best">0</strong></span>
    </div>

    <div class="grid" id="grid"></div>
    <div class="message" id="message">Premi "Inizia" per giocare</div>
    <div class="speed" id="speed"></div>

    <div class="controls">
      <button class="btn primary" id="start">Inizia</button>
      <button class="btn" id="restart">Ricomincia</button>
    </div>
  </main>

  <script>
    const PADS = [
      { name: "Rosso", color: "#ef4444", freq: 262 },
      { name: "Blu", color: "#3b82f6", freq: 330 },
      { name: "Verde", color: "#22c55e", freq: 392 },
      { name: "Giallo", color: "#eab308", freq: 523 }
    ];

    let sequence = [];
    let playerIndex = 0;
    let level = 0;
    let score = 0;
    let best = Number(localStorage.getItem("simon-best") || 0);
    let playing = false;
    let showing = false;
    let speed = 600;

    const gridEl = document.getElementById("grid");
    const levelEl = document.getElementById("level");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const messageEl = document.getElementById("message");
    const speedEl = document.getElementById("speed");

    bestEl.textContent = best;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function beep(freq, dur = 180) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur / 1000);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur / 1000);
    }

    function buildGrid() {
      gridEl.innerHTML = "";
      PADS.forEach((p, i) => {
        const btn = document.createElement("button");
        btn.className = "pad";
        btn.style.background = p.color;
        btn.style.color = p.color;
        btn.dataset.index = i;
        btn.addEventListener("click", () => handlePad(i));
        gridEl.appendChild(btn);
      });
    }

    function flashPad(i, dur = speed) {
      const btn = gridEl.children[i];
      btn.classList.add("lit");
      beep(PADS[i].freq, dur * 0.7);
      setTimeout(() => btn.classList.remove("lit"), dur);
    }

    function showSequence() {
      showing = true;
      playerIndex = 0;
      messageEl.textContent = "Osserva la sequenza…";
      messageEl.className = "message";
      let i = 0;
      const interval = setInterval(() => {
        if (i >= sequence.length) {
          clearInterval(interval);
          showing = false;
          messageEl.textContent = "Tocca i colori nell'ordine giusto!";
          return;
        }
        flashPad(sequence[i]);
        i++;
      }, speed + 120);
    }

    function nextLevel() {
      level++;
      score += level * 10;
      levelEl.textContent = level;
      scoreEl.textContent = score;
      speed = Math.max(220, 600 - level * 35);
      speedEl.textContent = `Velocità: ${speed} ms`;
      sequence.push(Math.floor(Math.random() * PADS.length));
      showSequence();
    }

    function handlePad(i) {
      if (!playing || showing) return;
      flashPad(i, 160);
      if (i === sequence[playerIndex]) {
        playerIndex++;
        if (playerIndex === sequence.length) {
          messageEl.textContent = "✅ Corretto!";
          messageEl.className = "message ok";
          setTimeout(nextLevel, 700);
        }
      } else {
        playing = false;
        messageEl.textContent = `❌ Errore! Hai raggiunto il livello ${level}.`;
        messageEl.className = "message ko";
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem("simon-best", best);
        }
      }
    }

    function start() {
      sequence = [];
      level = 0;
      score = 0;
      speed = 600;
      levelEl.textContent = level;
      scoreEl.textContent = score;
      speedEl.textContent = "";
      playing = true;
      messageEl.textContent = "Pronto…";
      messageEl.className = "message";
      setTimeout(nextLevel, 800);
    }

    document.getElementById("start").addEventListener("click", () => {
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!playing) start();
    });
    document.getElementById("restart").addEventListener("click", () => {
      if (audioCtx.state === "suspended") audioCtx.resume();
      start();
    });

    buildGrid();
  </script>
</body>
</html>
