<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linea del tempo – Guerre di religione in Europa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=11">
<style>
body {
  background-image: none !important;
}
</style>
</head>
<body>
<div id="app">
<header>
<div>
<h1>Guerre di religione in Europa</h1>
<div class="header-badges" style="display:flex;gap:8px;margin-top:4px"><span class="badge-client">📖 Vista Client (Lettura)</span></div>
</div>
</header>
<p class="hint">💡 <strong>Modalità Lettura</strong>: Consulta gli eventi storici. Clicca su un evento per vedere la scheda di approfondimento e gli appunti.</p>
<div class="wrap"><div class="tl" id="tl"></div></div>
<div class="actions">
<div class="bar">
<button id="zo" aria-label="Riduci la scala">−</button>
<button id="zi" aria-label="Ingrandisci la scala">+</button>
<button id="fit">Adatta</button>
<a href="modifica.html" class="btn-edit-nav">✏️ Modifica</a>
</div>
</div>
</div>

<dialog id="dlg">
<form method="dialog" id="f">
<h2 id="dt" style="margin:0;font:600 22px 'Inter',sans-serif">Evento</h2>
<label for="p">Paese</label><select id="p"></select>
<label for="y">Anno</label><input id="y" type="number" inputmode="numeric" required placeholder="1998">
<label for="t">Nome</label><input id="t" required placeholder="Nome evento">
<label for="n">Appunti</label><textarea id="n" placeholder="Cause, protagonisti, conseguenze…"></textarea>
<label>Colore evidenziatore</label>
<div class="swatches" id="sw"></div>
<div class="row">
<button type="submit" class="grow">Salva</button>
<button type="button" id="del" class="danger">Elimina</button>
<button type="button" id="close">Chiudi</button>
</div>
</form>
</dialog>

<dialog id="infoDlg" class="note-dialog">
<article class="note" id="iNote">
<span class="note-tape" aria-hidden="true"></span>
<div class="note-head">
<span class="note-year" id="iY"></span>
<h2 class="note-title" id="iT"></h2>
<p class="note-country" id="iP"></p>
</div>
<div class="note-body">
<p class="note-notes" id="iN"></p>
<a class="note-photo" id="iPhotoLink" target="_blank" rel="noopener noreferrer" hidden><img id="iPhoto" alt=""></a>
<a class="note-link" id="iLink" target="_blank" rel="noopener noreferrer" hidden>Apri link ↗</a>
</div>
<footer class="note-foot"><button type="button" id="iClose">Chiudi</button></footer>
</article>
</dialog>

<script src="app.js?v=5"></script>
</body>
</html>
